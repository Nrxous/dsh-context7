# dsh-context7 bundle patch: host-only plugin row inserted into the profile
# roster. Applied as a profile bundle layer (`dsh.bundle.patch` manifest field);
# `dsh plugin --profile <name> add dsh-context7` registers the dependency and
# auto-appends this bundle.
#
# 插件自身配置（apiKey）填写处：到 https://context7.com/dashboard 申请
# ctx7sk 开头的 key 后填入下方 config.apiKey，重启 DSH 生效；留空使用免 key 低限额访问。
- insert:
    - id: dsh-context7
      name: dsh-context7
      config:
        apiKey: ""
